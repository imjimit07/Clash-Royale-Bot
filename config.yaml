bot:
  max_consecutive_restarts: 5
  restart_backoff_base: 5
  state_timeout_seconds: 120
  state_warn_seconds: 60

detection:
  template_tolerance: 0.88
  fallback_tolerance: 0.78
  multi_scale: true
  black_frame_threshold: 5

elixir:
  hsv_low: [125, 80, 80]
  hsv_high: [165, 255, 255]
  wait_timeout: 20
  poll_interval: 0.3
  fail_limit_before_fallback: 5

emulator:
  name: "Google Play Games"
  rendering_mode: "OpenGL"
  process_name: "crosvm.exe"
  window_title: "Clash Royale"
  adb_port: 6520
  screenshot_interval: 0.1

humanization:
  click_jitter_px: 5
  min_action_delay: 0.08
  max_action_delay: 0.25
  min_pause: 0.3
  max_pause: 1.2

logging:
  level: INFO
  dir: logs
  rotate_mb: 5
  backup_count: 5

debug:
  save_unknown_screens: true
  save_on_crash: true
